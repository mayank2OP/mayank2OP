<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="38" y1="18" x2="1170" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D18"/>
      <stop offset=".52" stop-color="#0B1325"/>
      <stop offset="1" stop-color="#10142A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78A9FF"/>
      <stop offset=".52" stop-color="#8D82EA"/>
      <stop offset="1" stop-color="#DDA56F"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(913 204) rotate(90) scale(244)">
      <stop stop-color="#345FA7" stop-opacity=".45"/>
      <stop offset=".52" stop-color="#1A315E" stop-opacity=".18"/>
      <stop offset="1" stop-color="#080D18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow">
      <stop stop-color="#78A9FF" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#78A9FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#78A9FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#A8C5FF" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="30" fill="url(#grid)"/>
  <ellipse cx="913" cy="204" rx="304" ry="260" fill="url(#blueGlow)"/>
  <ellipse cx="84" cy="416" rx="280" ry="155" fill="#273E78" fill-opacity=".14" filter="url(#blur)"/>

  <g opacity=".5">
    <path d="M42 73H1158" stroke="#BBD1FF" stroke-opacity=".12"/>
    <path d="M42 356H1158" stroke="#BBD1FF" stroke-opacity=".12"/>
    <path d="M681 42V388" stroke="#BBD1FF" stroke-opacity=".12"/>
  </g>

  <g transform="translate(56 52)">
    <rect width="46" height="46" rx="14" fill="#78A9FF" fill-opacity=".12" stroke="#78A9FF" stroke-opacity=".4"/>
    <text x="23" y="30" text-anchor="middle" fill="#EAF1FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">MR</text>
    <text x="62" y="20" fill="#F5F7FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">MAYANK RAWAT</text>
    <text x="62" y="39" fill="#8494AE" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="1.5">FULL-STACK DEVELOPER / INDIA</text>
  </g>

  <g transform="translate(57 147)">
    <text fill="#78A9FF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2.1">DESIGNING USEFUL SOFTWARE WITH A PULSE</text>
    <text y="63" fill="#F6F8FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="57" font-weight="720" letter-spacing="-2.4">Digital systems</text>
    <text y="119" fill="#9AB9F5" font-family="Georgia,serif" font-size="55" font-style="italic" letter-spacing="-1.8">with gravity.</text>
    <text y="168" fill="#9AA8BB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Interfaces, secure APIs, data, and delivery — engineered as one system.</text>
  </g>

  <g transform="translate(57 350)">
    <circle cx="6" cy="6" r="4" fill="#78A9FF" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="10" fill="#A9B8CE" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="1.4">AVAILABLE FOR SOFTWARE ENGINEERING OPPORTUNITIES</text>
  </g>

  <g transform="translate(908 210)">
    <circle r="176" fill="url(#coreGlow)" opacity=".35"/>
    <circle r="165" stroke="#78A9FF" stroke-opacity=".16"/>
    <circle r="128" stroke="#78A9FF" stroke-opacity=".25" stroke-dasharray="5 8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="42s" repeatCount="indefinite"/>
    </circle>
    <circle r="91" stroke="#8D82EA" stroke-opacity=".3" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="57" fill="#0B152A" fill-opacity=".82" stroke="#9AB9F5" stroke-opacity=".42"/>
    <circle r="48" stroke="#78A9FF" stroke-opacity=".12">
      <animate attributeName="r" values="43;52;43" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".08;.35;.08" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text y="-5" text-anchor="middle" fill="#F6F8FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">MR</text>
    <text y="17" text-anchor="middle" fill="#7F91AC" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="7" letter-spacing="1.2">CONNECTED PRACTICE</text>

    <g transform="translate(132 -68)">
      <circle r="26" fill="#101B31" stroke="#78A9FF" stroke-opacity=".55"/>
      <circle r="4" fill="#78A9FF" filter="url(#softGlow)">
        <animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text y="3" text-anchor="middle" fill="#EAF1FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">SS</text>
      <text y="42" text-anchor="middle" fill="#8EA1BC" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="7">SPENDSNAP</text>
    </g>
    <g transform="translate(-123 -83)">
      <circle r="26" fill="#15162E" stroke="#8D82EA" stroke-opacity=".58"/>
      <text y="3" text-anchor="middle" fill="#EEEAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">SP</text>
      <text y="42" text-anchor="middle" fill="#958DBE" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="7">STOCKPILOT</text>
    </g>
    <g transform="translate(-23 158)">
      <circle r="26" fill="#211A1B" stroke="#DDA56F" stroke-opacity=".55"/>
      <text y="3" text-anchor="middle" fill="#F8EBDD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">LF</text>
      <text y="42" text-anchor="middle" fill="#B39A82" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="7">LINKFORGE</text>
    </g>

    <g>
      <circle cx="0" cy="-128" r="4" fill="#78A9FF" filter="url(#softGlow)"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>

  <path d="M42 390H1158" stroke="url(#edge)" stroke-width="2" stroke-linecap="round" stroke-dasharray="180 940">
    <animate attributeName="stroke-dashoffset" values="1120;-1120" dur="7s" repeatCount="indefinite"/>
  </path>
  <rect x="1" y="1" width="1198" height="428" rx="29" stroke="url(#edge)" stroke-opacity=".42" stroke-width="2"/>
</svg>
