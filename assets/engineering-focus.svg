<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="20" y1="12" x2="1180" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/>
      <stop offset=".55" stop-color="#10182B"/>
      <stop offset="1" stop-color="#111126"/>
    </linearGradient>
    <linearGradient id="signal" x1="50" y1="0" x2="1150" y2="0">
      <stop stop-color="#78A9FF"/>
      <stop offset=".55" stop-color="#8D82EA"/>
      <stop offset="1" stop-color="#DDA56F"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" stroke="#B2CAFF" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="25" fill="url(#panel)" stroke="#90B4FF" stroke-opacity=".23" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="328" rx="25" fill="url(#grid)"/>
  <text x="50" y="56" fill="#78A9FF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">CONNECTED PRACTICE / 04 SYSTEMS</text>
  <text x="50" y="94" fill="#F5F7FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="720">One product mind. Every layer.</text>
  <text x="50" y="122" fill="#8796AC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">I work where interface decisions meet API boundaries, data models, and production delivery.</text>

  <g transform="translate(50 155)">
    <rect width="252" height="126" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#78A9FF" stroke-opacity=".25"/>
    <text x="20" y="28" fill="#78A9FF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" letter-spacing="1.3">01 / INTERFACES</text>
    <text x="20" y="62" fill="#EEF3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Responsive UX</text>
    <text x="20" y="88" fill="#8796AC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">React • Next.js • TypeScript</text>
    <rect x="20" y="106" width="144" height="3" rx="2" fill="#78A9FF" fill-opacity=".24"/>
    <rect x="20" y="106" width="72" height="3" rx="2" fill="#78A9FF">
      <animate attributeName="width" values="40;124;72;40" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(319 155)">
    <rect width="252" height="126" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#78A9FF" stroke-opacity=".25"/>
    <text x="20" y="28" fill="#78A9FF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" letter-spacing="1.3">02 / SYSTEMS</text>
    <text x="20" y="62" fill="#EEF3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Secure services</text>
    <text x="20" y="88" fill="#8796AC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Java • Spring Boot • JWT</text>
    <circle cx="218" cy="28" r="5" fill="#78A9FF" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(588 155)">
    <rect width="252" height="126" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#8D82EA" stroke-opacity=".28"/>
    <text x="20" y="28" fill="#AFA7F5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" letter-spacing="1.3">03 / DATA</text>
    <text x="20" y="62" fill="#EEF3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Useful models</text>
    <text x="20" y="88" fill="#8796AC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">PostgreSQL • MySQL • Analytics</text>
    <path d="M199 29H228M199 38H220M199 47H212" stroke="#8D82EA" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(857 155)">
    <rect width="293" height="126" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#DDA56F" stroke-opacity=".28"/>
    <text x="20" y="28" fill="#E3B98E" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" letter-spacing="1.3">04 / DELIVERY</text>
    <text x="20" y="62" fill="#EEF3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Production paths</text>
    <text x="20" y="88" fill="#8796AC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Docker • Cloudflare • Render</text>
    <circle cx="256" cy="31" r="12" stroke="#DDA56F" stroke-opacity=".6">
      <animate attributeName="r" values="8;18;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".65;0;.65" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M50 303H1150" stroke="url(#signal)" stroke-width="2" stroke-dasharray="120 980">
    <animate attributeName="stroke-dashoffset" values="1100;-1100" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>
